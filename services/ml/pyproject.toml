[project]
name = "forecast-ml"
version = "0.1.0"
description = "Stateless forecasting + EDA service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "numpy>=1.26,<2",
    "pandas>=2.2,<3",
    "statsmodels>=0.14.2",
    # Exact pin: golden-file determinism depends on the numba-compiled model
    # code not shifting under us. Bump deliberately, then regen goldens.
    "statsforecast==2.0.3",
    "scipy>=1.11",
    "forecast-shared",
]

[tool.uv.sources]
forecast-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml"]
