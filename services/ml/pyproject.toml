[project]
name = "forecast-ml"
version = "0.1.0"
description = "Stateless forecasting + EDA service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "numpy>=1.26,<2",
    "pandas>=2.2,<3",
    "statsmodels>=0.14.2",
    "pmdarima==2.0.4",
    # pmdarima 2.0.4 calls sklearn's check_array(force_all_finite=...), which
    # sklearn 1.6 renamed and 1.8 removed. Pin below 1.6 until pmdarima updates.
    "scikit-learn>=1.3,<1.6",
    "scipy>=1.11",
    "forecast-shared",
]

[tool.uv.sources]
forecast-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml"]
