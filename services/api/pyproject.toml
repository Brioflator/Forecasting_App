[project]
name = "forecast-api"
version = "0.1.0"
description = "API service: connector/metric CRUD, forecast trigger, export, webhook ingress"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "alembic>=1.13",
    "pyyaml>=6",
    "jsonschema>=4.20",
    "openpyxl>=3.1",
    "httpx>=0.27",
    "pyjwt>=2.8",
    "forecast-shared",
]

[tool.uv.sources]
forecast-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]
