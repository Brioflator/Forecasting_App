[project]
name = "forecast-platform"
version = "0.1.0"
description = "Forecast Platform — self-hostable metric collection + forecasting"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.5",
    "mypy>=1.10",
    "httpx>=0.27",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pyyaml>=6",
    "types-PyYAML>=6",
    "types-jsonschema>=4.20",
    "types-croniter>=2",
    "types-openpyxl>=3.1",
]

[tool.uv.workspace]
members = ["services/api", "services/worker", "services/ml", "shared", "agent"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
src = ["shared/src", "services/api/src", "services/worker/src", "services/ml/src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
mypy_path = "shared/src:services/api/src:services/worker/src:services/ml/src:agent/src"
files = ["shared/src", "services/api/src", "services/worker/src", "services/ml/src", "agent/src"]
explicit_package_bases = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = [
    "pmdarima.*",
    "statsmodels.*",
    "scipy.*",
    "jsonpath_ng.*",
    "apscheduler.*",
    "pandas.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
# importlib mode: each test module is imported under a unique rootdir-derived
# name, so the tests dirs don't collide (no __init__.py, no relative imports).
# NOTE: shared's tests live at tests/shared (NOT shared/tests) — a tests dir
# under a directory named like an installed package makes pytest materialize a
# namespace `shared` that shadows the real one.
addopts = "--import-mode=importlib"
testpaths = ["tests", "services/ml/tests", "services/api/tests", "services/worker/tests", "agent/tests"]
