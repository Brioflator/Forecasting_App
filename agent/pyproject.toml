[project]
name = "forecast-agent"
version = "0.1.0"
description = "Self-hosted polling agent — your source credentials never leave your machine"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6",
    "jsonpath-ng>=1.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forecast_agent"]
