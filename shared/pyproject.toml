[project]
name = "forecast-shared"
version = "0.1.0"
description = "Shared DTOs, settings, provider seam, and DB mapping layer"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.1",
    "redis>=5",
    "pyjwt>=2.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shared"]
